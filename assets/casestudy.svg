<rect x="587.8" y="126" width="106" height="30" rx="15" fill="#0F172A" stroke="#3B82F6" stroke-opacity=".55"><animate attributeName="stroke-opacity" values=".55;1;.55" dur="3s" begin="1.5s" repeatCount="indefinite"/></rect>
<circle cx="603.8" cy="141" r="3.5" fill="#60A5FA"/>
