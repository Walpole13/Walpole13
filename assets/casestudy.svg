<text x="36" y="104" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#94A3B8">Application métier interne, auto-hébergée — FastAPI + React.</text>
