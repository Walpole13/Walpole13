<rect x="703.4" y="126" width="155" height="30" rx="15" fill="#0F172A" stroke="#3B82F6" stroke-opacity=".55"><animate attributeName="stroke-opacity" values=".55;1;.55" dur="3s" begin="2.0s" repeatCount="indefinite"/></rect>
