<text x="36" y="192" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" fill="#94A3B8">FastAPI · Python · SQLAlchemy · PostgreSQL · React · TypeScript · Vite · Tailwind · Docker · Nginx</text>
<g transform="translate(36.0,208.0) scale(0.667)" fill="none" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></g>
<text x="60" y="221" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#F59E0B">Auto-hébergé chez le client — secret professionnel oblige. Dépôt privé.</text>
