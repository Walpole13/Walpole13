<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Florian Monnier. Développement sur mesure et automatisation.">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0D1117"/><stop offset="1" stop-color="#131922"/></linearGradient>
  <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0F6CBD"/><stop offset=".55" stop-color="#7FBA00"/><stop offset="1" stop-color="#FFB900"/></linearGradient>
  <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="70"/></filter>
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="rgba(0,0,0,.35)"/></filter>
</defs>

<rect width="1200" height="320" fill="url(#bg)"/>
<circle cx="144" cy="112" r="200" fill="#0F6CBD" fill-opacity=".13" filter="url(#blur)"><animate attributeName="cx" values="144;204;144" dur="18s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1"/><animate attributeName="cy" values="112;82;112" dur="23s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1"/></circle>
<circle cx="1056" cy="48" r="170" fill="#7FBA00" fill-opacity=".13" filter="url(#blur)"><animate attributeName="cx" values="1056;1116;1056" dur="22s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1"/><animate attributeName="cy" values="48;18;48" dur="27s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1"/></circle>
<circle cx="840" cy="336" r="150" fill="#FFB900" fill-opacity=".13" filter="url(#blur)"><animate attributeName="cx" values="840;900;840" dur="26s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1"/><animate attributeName="cy" values="336;306;336" dur="31s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1"/></circle>
<text  x="84" y="118" font-family="'Segoe UI Variable','Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#4CC2FF" letter-spacing="2.5"><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.067;1" dur="0.75s" fill="freeze" calcMode="spline" keySplines="0 0 1 1;.16 1 .3 1"/>DROIT · CODE · AUTOMATISATION</text>
<text  x="84" y="182" font-family="'Segoe UI Variable','Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif" font-size="58" font-weight="600" fill="#F0F3F6" letter-spacing="-1"><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.195;1" dur="0.87s" fill="freeze" calcMode="spline" keySplines="0 0 1 1;.16 1 .3 1"/>Florian Monnier</text>
<text  x="84" y="226" font-family="'Segoe UI Variable','Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif" font-size="22" font-weight="400" fill="#B6BEC9"><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.293;1" dur="0.99s" fill="freeze" calcMode="spline" keySplines="0 0 1 1;.16 1 .3 1"/>Je développe ce que vos logiciels ne font pas.</text>
<rect  x="84" y="252" width="88" height="4" rx="2" fill="url(#brand)"><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.369;1" dur="1.11s" fill="freeze" calcMode="spline" keySplines="0 0 1 1;.16 1 .3 1"/></rect>
<text  x="188" y="262" font-family="'Segoe UI Variable','Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif" font-size="14" fill="#8B949E"><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.431;1" dur="1.23s" fill="freeze" calcMode="spline" keySplines="0 0 1 1;.16 1 .3 1"/>Gavroche Solutions · Aix-Marseille</text>
</svg>