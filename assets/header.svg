<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="1200" height="260" role="img" aria-label="Florian Monnier — droit, code, automatisation">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="55%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E3A5F"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1D4ED8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#3B82F6" stop-opacity="1"/>
      <stop offset="100%" stop-color="#1D4ED8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0"/>
      <stop offset="50%" stop-color="#60A5FA" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#3B82F6" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="50%" cy="120%" r="70%">
      <stop offset="0%" stop-color="#1D4ED8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#1D4ED8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="260" fill="url(#bg)"/>
  <rect width="1200" height="260" fill="url(#grid)"/>
  <rect width="1200" height="260" fill="url(#glow)"/>

  <!-- filet animé : balayage lent, discret -->
  <rect x="0" y="258" width="1200" height="2" fill="url(#rule)"/>
  <rect y="258" width="300" height="2" fill="url(#scan)">
    <animate attributeName="x" values="-300;1200" dur="9s" repeatCount="indefinite"/>
  </rect>

  <g font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">
    <text x="600" y="112" font-size="58" font-weight="700" fill="#E2E8F0" letter-spacing="-0.5">Florian Monnier</text>
    <text x="600" y="152" font-size="17" font-weight="500" fill="#3B82F6" letter-spacing="5.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">DROIT · CODE · AUTOMATISATION</text>
  </g>

  <path d="M440 176H760" stroke="url(#rule)" stroke-width="1"/>

  <text x="600" y="210" text-anchor="middle" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#94A3B8">
    Développement sur mesure &amp; automatisation de processus — Aix-Marseille
  </text>
</svg>
