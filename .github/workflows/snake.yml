# Serpent de contributions (Platane/snk). Aucune configuration requise : le jeton
# automatique du dépôt suffit. Le SVG est publié sur la branche « output » et
# affiché dans le README (section Activité).
name: Snake

on:
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - name: Générer le serpent
        uses: Platane/snk@v3
        with:
          github_user_name: Walpole13
          outputs: |
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#4CC2FF&color_dots=#161B22,#12283A,#0F6CBD,#2E9BE8,#4CC2FF

      - name: Publier sur la branche output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
