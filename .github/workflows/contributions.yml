# Calendrier de contributions dans la charte du README (assets/contributions.svg).
# Aucun réglage : le jeton automatique suffit pour lire le calendrier public.
# Les dépôts privés comptent si « Include private contributions » est activé sur le profil.
name: Contributions

on:
  schedule:
    - cron: "41 4 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rendre le calendrier
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: Walpole13
        run: python3 scripts/contributions.py --out assets/contributions.svg

      - name: Publier si le rendu a changé
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/contributions.svg
          git diff --cached --quiet && echo "aucun changement" || (git commit -m "Calendrier de contributions : mise à jour" && git push)
